<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>DS CAM — Button</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/><link rel="stylesheet" href="assets/tokens.css"/><link rel="stylesheet" href="assets/showcase.css"/><link rel="stylesheet" href="design-specs/buttons.css"/></head><body><div class="app"><main class="main"><div class="topbar"><button class="hamburger" aria-label="Menu">&#9776;</button><div class="crumb"><b>Forms</b> · Button</div></div><div class="content"><h1>Button</h1><a class="spec-link" href="design-specs/buttons.md">&#128196; Spec (IA)</a>
<p>Ações. Variants: contained / outlined / text. Com ícone, cores funcionais, IconButton, ToggleButton.</p>
<div class="demo-label">Variants</div>
<div class="demo"><button class="btn contained">Contained</button><button class="btn outlined">Outlined</button><button class="btn text">Text</button><button class="btn contained" disabled>Disabled</button></div>

<div class="demo"><button class="btn contained">▶ Iniciar paper</button><button class="btn outlined">⤓ Importar CSV</button><button class="btn icon" title="Pausar">⏸</button></div>

<div class="demo"><button class="btn tgl active">Líquido</button><button class="btn tgl">Bruto*</button></div>
<p style="font-size:var(--text-small);color:var(--muted-foreground)">*Bruto é didático — UI sempre exibe líquido (Art. 25º).</p>
</div></main></div><script src="assets/nav.js"></script></body></html>
