# Alembic Configuration File — CaM Cockpit Backend

[alembic]
# Caminho para o diretório de scripts de migration
script_location = alembic

# Formato do nome dos arquivos de migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone para timestamps nas migrations
timezone = America/Sao_Paulo

# database_url é lida do Settings (pydantic-settings) no env.py
# Não colocar a URL aqui para evitar exposição de credenciais

[post_write_hooks]
# Formatar migrations com ruff automaticamente
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
