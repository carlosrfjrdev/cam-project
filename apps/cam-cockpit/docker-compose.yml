services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: cam
      POSTGRES_PASSWORD: cam
      POSTGRES_DB: cam_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cam -d cam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
